<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>PandaStays Checkout</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "error": "#ba1a1a",
                        "on-surface-variant": "#3c4a42",
                        "secondary-fixed-dim": "#bcc7de",
                        "surface-container-low": "#eff4ff",
                        "on-secondary-container": "#586377",
                        "surface-container-high": "#dce9ff",
                        "inverse-primary": "#4edea3",
                        "secondary-fixed": "#d8e3fb",
                        "on-error-container": "#93000a",
                        "surface-dim": "#cbdbf5",
                        "on-primary-fixed": "#002113",
                        "surface": "#f8f9ff",
                        "background": "#f8f9ff",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-fixed-variant": "#3c475a",
                        "on-primary-fixed-variant": "#005236",
                        "inverse-surface": "#213145",
                        "surface-container-highest": "#d3e4fe",
                        "outline-variant": "#bbcabf",
                        "on-surface": "#0b1c30",
                        "surface-tint": "#006c49",
                        "surface-container": "#e5eeff",
                        "on-primary-container": "#00422b",
                        "on-error": "#ffffff",
                        "on-background": "#0b1c30",
                        "on-secondary-fixed": "#111c2d",
                        "tertiary-fixed": "#ffddb8",
                        "on-tertiary": "#ffffff",
                        "primary-fixed-dim": "#4edea3",
                        "on-tertiary-container": "#523200",
                        "tertiary-container": "#e29100",
                        "outline": "#6c7a71",
                        "secondary": "#545f73",
                        "inverse-on-surface": "#eaf1ff",
                        "primary-fixed": "#6ffbbe",
                        "on-tertiary-fixed": "#2a1700",
                        "secondary-container": "#d5e0f8",
                        "on-primary": "#ffffff",
                        "tertiary-fixed-dim": "#ffb95f",
                        "surface-bright": "#f8f9ff",
                        "surface-variant": "#d3e4fe",
                        "on-secondary": "#ffffff",
                        "primary-container": "#10b981",
                        "error-container": "#ffdad6",
                        "tertiary": "#855300",
                        "primary": "#006c49",
                        "on-tertiary-fixed-variant": "#653e00"

                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "sidebar-width": "260px",
                        "page-margin-dt": "2rem",
                        "page-margin-mb": "1rem",
                        "gutter": "1rem",
                        "container-max": "1440px",
                        "stack-default": "1.5rem",
                        "stack-compact": "0.5rem"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "display-lg": ["Inter"],
                        "data-mono": ["JetBrains Mono"],
                        "label-caps": ["Inter"],
                        "body-sm": ["Inter"],
                        "title-sm": ["Inter"],
                        "headline-md": ["Inter"]
                    },
                    "fontSize": {
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "data-mono": ["13px", { "lineHeight": "16px", "fontWeight": "500" }],

<body class="bg-background text-on-background h-full font-body-md flex items-center justify-center p-4">
<!-- Checkout Card -->
<div class="w-full max-w-[400px] bg-surface-container-lowest border border-outline-variant rounded-xl shadow-lg flex flex-col overflow-hidden">
<!-- Header -->
<div class="bg-surface p-6 border-b border-outline-variant text-center">
<h1 class="font-headline-md text-headline-md text-on-surface mb-1">PandaStays</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Mukuba Boarding House - Rent Payment</p>
</div>
<!-- Order Summary -->
<div class="p-6 space-y-4">
<div class="flex justify-between items-center border-b border-outline-variant pb-4">
<span class="font-body-sm text-body-sm text-on-surface-variant">Tenant</span>
<span class="font-title-sm text-title-sm text-on-surface">Chileshe Mubanga</span>
</div>
<div class="flex justify-between items-center border-b border-outline-variant pb-4">
<span class="font-body-sm text-body-sm text-on-surface-variant">Room</span>
<span class="font-title-sm text-title-sm text-on-surface">Room 4 Bed A</span>
</div>
<div class="flex justify-between items-center pt-2">
<span class="font-body-md text-body-md text-on-surface font-semibold">Amount Due</span>
<span class="font-headline-md text-headline-md text-primary font-bold">ZMW 800</span>
</div>
</div>
<!-- Payment Input -->
<div class="p-6 bg-surface-container-low border-t border-outline-variant">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2 uppercase">Mobile Money Phone Number</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-3">
<span class="material-symbols-outlined text-outline">phone_iphone</span>
</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-lowest border border-outline rounded-lg font-data-mono text-data-mono text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary-container/20 transition-all" placeholder="09X XXX XXXX" type="tel"/>
</div>
<!-- Mobile Money Logos (Placeholders) -->
<div class="flex gap-3 mt-4 justify-center">
<div class="w-12 h-8 bg-surface-variant rounded flex items-center justify-center text-xs font-bold text-on-surface-variant border border-outline-variant">MTN</div>
<div class="w-12 h-8 bg-surface-variant rounded flex items-center justify-center text-xs font-bold text-on-surface-variant border border-outline-variant">AIRTEL</div>
<div class="w-12 h-8 bg-surface-variant rounded flex items-center justify-center text-xs font-bold text-on-surface-variant border border-outline-variant">ZAMTEL</div>
</div>
<!-- Action -->
<button class="w-full mt-6 bg-primary text-on-primary py-3 rounded-lg font-title-sm text-title-sm hover:bg-surface-tint active:scale-[0.98] transition-all flex items-center justify-center gap-2 shadow-[inset_0_-2px_4px_rgba(0,0,0,0.1)]">
<span class="material-symbols-outlined text-[18px]">payments</span>
                Pay ZMW 800 via Prompt
            </button>
</div>
<!-- Footer -->
<div class="p-4 bg-surface text-center flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-outline text-[16px]">lock</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Secure Payment powered by Lenco</span>
</div>
</div>
</body></html>
